<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>날씨 앱</title>
</head>
<body>
    <h1>날씨 검색</h1>
    
    <input type="text" id="cityInput" placeholder="도시 이름 입력 (영어)">
    <button onclick="getWeather()">검색</button>
    
    <div id="result"></div>
    <h2>최근 검색 기록</h2>
    <div id="history"></div>

    <script>
        // 기존 getWeather 함수는 그대로 두고 아래 함수 추가
        async function getHistory() {
            const response = await fetch("http://localhost:8000/history");
            const data = await response.json();
            
            document.getElementById("history").innerHTML = data.history
                .map(h => `<p>${h.city} - ${h.searched_at}</p>`)
                .join("");
        }

        // 페이지 열리면 자동으로 기록 불러오기
        getHistory();
    </script>

    <script>
        async function getWeather() {
            const city = document.getElementById("cityInput").value;
            const response = await fetch(`http://localhost:8000/weather/${city}`);
            const data = await response.json();
            
            document.getElementById("result").innerHTML = `
                <p>도시: ${data.city}</p>
                <p>날씨: ${data.desc}</p>
                <p>온도: ${data.temp}°C (체감 ${data.feels_like}°C)</p>
                <p>습도: ${data.humidity}%</p>
                <p>기압: ${data.pressure}hPa</p>
                <p>시야: ${data.visibility}km</p>
            `;
            getHistory();
        }
    </script>
</body>
</html>
